name: Tests
on:
  push:
    branches:
      - master
      - main
      - dev
    pull_request:
      branches:
        - master
        - main
        - dev
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        timeout-minutes: 45
        run: go test -v -timeout 40m ./...
