name: CI

# One workflow, because `needs` cannot reach across workflow files. The image
# job used to live in its own and therefore shipped on every push whatever the
# tests said - a broken test went three commits unnoticed that way.
#
# pull_request must sit at the top level. It used to be nested under push,
# which silently meant no check ever ran on a pull request.
on:
  push:
    branches:
      - master
      - main
      - dev
  pull_request:
    branches:
      - master
      - main
      - dev
  workflow_dispatch:

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan the pushed range rather than one commit
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # the checkout has LF line endings, so a plain gofmt check is meaningful
      # here even though a windows working copy with core.autocrlf reports
      # almost every file as unformatted
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt reports deviations in:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # only what this push or pull request changes: the findings older than the
      # gate are listed by a full local run and do not block
      - name: Lint
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git merge-base HEAD origin/master)"
          fi
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run --new-from-rev="$BASE" ./...

      # the generated openapi files are committed so the spec is readable without
      # a build; a diff here means a handler changed and the spec was not regenerated
      - name: OpenAPI
        run: |
          go generate ./...
          git diff --exit-code -- docs/

      # docs/asyncapi-gen is a separate go module (docs/asyncapi-regeneration.md),
      # so the OpenAPI step's `go generate ./...` above never reaches it; a diff
      # here means a message type or topic changed and the spec was not regenerated
      - name: AsyncAPI
        run: |
          (cd docs/asyncapi-gen && go generate ./...)
          npx --yes @asyncapi/cli@6.2.0 convert docs/asyncapi-gen/asyncapi.json -f asyncapi -t 3.0.0 -o docs/asyncapi.json
          git diff --exit-code -- docs/asyncapi.json

      - name: Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # the action refuses to run in an organization repo without a license
          # key; the key is an org secret and reaches the action only when the
          # workflow hands it over explicitly
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Vulnerabilities
        # the curated gate from .claude/gates.env: plain govulncheck exits non-zero
        # on called findings that have no upstream fix, which blocks forever with
        # nothing anyone can do. vulngate fails only on fixable findings in direct
        # dependencies and keeps the rest listed.
        run: go run ./tools/vulngate

  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Test
        timeout-minutes: 45
        run: go test -v -timeout 40m ./...

  image:
    name: PROD Docker Image
    # the gate this workflow exists for: no image leaves without the tests and
    # the gates behind it
    needs: [gates, test]
    # prod.yml also ran on a push of a version tag. That trigger is gone: this
    # job creates the tag itself, so keeping it would run the whole suite a
    # second time on the same tree for every release. A build from a tag is
    # still a workflow_dispatch on that ref.
    #
    # The ref decides, not the event. A workflow_dispatch used to land here
    # whatever branch it ran on, so a dispatch on dev would have released a prod
    # image and a version tag off the dev branch.
    if: >-
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          release_branches: ".*"
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            smartenergyplatform/moses:prod
            ghcr.io/senergy-platform/moses:prod
            smartenergyplatform/moses:${{ steps.tag_version.outputs.new_tag }}
            ghcr.io/senergy-platform/moses:${{ steps.tag_version.outputs.new_tag }}
            smartenergyplatform/moses:latest
            ghcr.io/senergy-platform/moses:latest

  dev-image:
    name: DEV Docker Image
    # dev.yml built this image on every push to dev without any gate in front of
    # it - the same hole the prod image had, one branch further. It carries no
    # version tag: only the prod job releases.
    needs: [gates, test]
    if: >-
      github.ref == 'refs/heads/dev' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            smartenergyplatform/moses:dev
            ghcr.io/senergy-platform/moses:dev
