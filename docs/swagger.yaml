basePath: /
definitions:
  api.BackfillRequest:
    properties:
      from:
        example: "2026-07-01T00:00:00Z"
        type: string
      to:
        example: "2026-08-01T00:00:00Z"
        type: string
    type: object
  api.CreateDeviceRequest:
    properties:
      device_type_id:
        type: string
      name:
        type: string
    type: object
  api.EnvironmentState:
    properties:
      as_of:
        description: |-
          AsOf is when the values were read, RFC3339. It is not decoration: a zone
          value with a time constant is on its way to a set point and is resolved to
          exactly this instant, so the number means nothing without it.
        example: "2026-08-27T09:41:00Z"
        type: string
      assets:
        additionalProperties:
          additionalProperties: true
          type: object
        type: object
      context:
        additionalProperties: true
        type: object
      history_running:
        description: |-
          HistoryRunning says that the environment stands at a past instant while a
          history run rebuilds it. It carries no state then and is not running in the
          live sense, which is why it is a flag of its own rather than a state an
          editor would show as current.
        example: false
        type: boolean
      running:
        description: |-
          Running says whether this instance simulates the environment at all. An
          environment that is stored but not running here is not an error - it is
          the normal case for a document that was just written, or one another
          instance runs - and it carries no state, which is what an editor turns
          into its empty state.
        example: true
        type: boolean
      zones:
        additionalProperties:
          additionalProperties: true
          type: object
        type: object
    type: object
  api.HistoryRequest:
    properties:
      from:
        example: "2026-07-01T00:00:00Z"
        type: string
    type: object
  api.ShareFailure:
    properties:
      error:
        type: string
      id:
        type: string
      kind:
        description: Kind is "device" or "graph".
        example: device
        type: string
      status:
        description: |-
          Status is what permissions-v2 answered, or 0 where it could not be
          reached at all. It is what decides whether the call as a whole is the
          caller's fault.
        example: 400
        type: integer
    type: object
  api.ShareFailures:
    properties:
      devices:
        items:
          $ref: '#/definitions/api.ShareFailure'
        type: array
    type: object
  api.ShareTargets:
    properties:
      groups:
        items:
          type: string
        type: array
      users:
        items:
          type: string
        type: array
    type: object
  api.SharesResponse:
    properties:
      devices:
        example: 32
        type: integer
      graph:
        description: |-
          Graph says whether the graph this environment is mirrored as is shared
          along with the devices. False for an environment that has none, which is
          one whose mirror never succeeded.
        example: true
        type: boolean
      groups:
        items:
          type: string
        type: array
      users:
        items:
          type: string
        type: array
    type: object
  devices.Device:
    properties:
      device_type_id:
        type: string
      id:
        type: string
      local_id:
        type: string
      name:
        type: string
    type: object
  devices.DeviceType:
    properties:
      id:
        type: string
      name:
        type: string
      services:
        items:
          $ref: '#/definitions/devices.Service'
        type: array
    type: object
  devices.Service:
    properties:
      characteristic_id:
        description: |-
          CharacteristicId and ValuePath come from the output's content variable:
          the characteristic gives the value its meaning and unit, the path names
          the variable inside the message.
        type: string
      direction:
        $ref: '#/definitions/domain.Direction'
      id:
        type: string
      name:
        type: string
      value_path:
        type: string
    type: object
  domain.AnchorMode:
    enum:
    - loop
    - original
    type: string
    x-enum-varnames:
    - AnchorLoop
    - AnchorOriginal
  domain.Asset:
    properties:
      channels:
        items:
          $ref: '#/definitions/domain.Channel'
        type: array
      external_managed:
        description: |-
          ExternalManaged tells a device moses created for this asset apart from one
          the user picked and attached to it. Only a managed device is deleted again
          when the asset or environment disappears; a picked device is platform
          inventory and outlives the simulation.

          The server decides this, never the client, since the whole document is
          sent on every update and a stale or invented flag would otherwise decide
          whether a real device is deleted. See reconcileManagedFlags in lib/api.
        type: boolean
      external_ref:
        description: |-
          Preserved verbatim across a migration: they keep the existing timeseries
          in timescale attached to this asset.
        type: string
      external_type_id:
        type: string
      id:
        type: string
      initial_states:
        additionalProperties: true
        type: object
      kind:
        $ref: '#/definitions/domain.AssetKind'
      name:
        type: string
      submetered_by:
        description: |-
          SubmeteredBy names, by asset id, the asset whose device meters this one
          too: what that asset reads already contains what this one draws or
          produces. Empty is the ordinary case and means this asset attaches to its
          zone in the mirrored graph, the behavior of every document stored before
          this field existed.

          Unlike ExternalManaged and ExternalRef, this is authoring, not
          reconciliation: nothing on the platform is read back to correct a wrong
          value, so a bad value only misrepresents this simulation's own meter tree.
        type: string
    type: object
  domain.AssetKind:
    enum:
    - meter
    - inverter
    - machine
    - sensor
    - actuator
    type: string
    x-enum-varnames:
    - AssetMeter
    - AssetInverter
    - AssetMachine
    - AssetSensor
    - AssetActuator
  domain.ChangeTrigger:
    properties:
      absolute:
        description: Absolute is a deviation in the channel's own unit.
        type: number
      evaluate_interval_seconds:
        description: |-
          EvaluateIntervalSeconds is how often the value is computed and compared.
          It sits in the trigger and not on the channel because a third interval
          there would be representable without a trigger and mean nothing. A
          channel whose source carries its own interval must leave this at zero:
          one channel has exactly one evaluation cadence.
        type: integer
      relative:
        description: |-
          Relative is a fraction of the last published value: 0.05 is five percent.
          It is compared by multiplying the threshold rather than dividing the
          deviation through it, so a last published value of 0 is a base every
          deviation exceeds instead of a division by zero.
        type: number
    type: object
  domain.Channel:
    properties:
      characteristic_id:
        description: |-
          From the device type's content variable. Unit is denormalised so an
          exported document stays readable without resolving the characteristic.
        type: string
      direction:
        $ref: '#/definitions/domain.Direction'
      external_ref:
        description: ExternalRef is the platform service id this channel publishes
          to.
        type: string
      faults:
        description: |-
          Faults are the defects injected into this channel's measurement: an
          outage, a frozen reading, a spike, a meter exchange. Empty is the ordinary
          case and the behaviour of every document stored before this field existed;
          the simulation itself never sees them, see docs/injected-faults.md.
        items:
          $ref: '#/definitions/domain.Fault'
        type: array
      id:
        type: string
      interval_seconds:
        description: |-
          IntervalSeconds is how often a sensor channel emits. Zero means the
          channel is only driven from outside, which is the normal case for actuators.

          With PublishOnChange set it is the heartbeat instead: the longest silence
          the channel allows, counted from the last publish whatever its reason was.
        type: integer
      name:
        type: string
      publish_on_change:
        allOf:
        - $ref: '#/definitions/domain.ChangeTrigger'
        description: |-
          PublishOnChange makes the channel send when its value moves, independently
          of the clock - the way real metering hardware behaves, and what a
          ticker-only simulation cannot reproduce. Nil is the ordinary case and means
          the channel publishes on IntervalSeconds alone, which is what every
          document stored before this field existed does.
      source:
        $ref: '#/definitions/domain.Source'
      unit:
        type: string
    type: object
  domain.DatasetOrigin:
    enum:
    - platform
    - file
    - endpoint
    type: string
    x-enum-varnames:
    - OriginPlatform
    - OriginFile
    - OriginEndpoint
  domain.DatasetSource:
    properties:
      anchor:
        $ref: '#/definitions/domain.AnchorMode'
      column:
        description: |-
          Column selects the value column: for an uploaded dataset the column name
          (empty means the first one), for a platform timeseries the path of the
          output variable, e.g. "value" or "energy.value".
        type: string
      cumulative:
        description: |-
          A meter reading keeps counting across a loop boundary instead of jumping
          back to the first value.
        type: boolean
      origin:
        $ref: '#/definitions/domain.DatasetOrigin'
      ref:
        description: Ref is a platform device id, an uploaded dataset id or a url,
          per Origin.
        type: string
      resample:
        $ref: '#/definitions/domain.ResampleMode'
      scale:
        description: |-
          Scale multiplies every value, for adapting a foreign profile in size.
          Zero means unscaled, so a document that omits it plays the data as is.
        type: number
      service_ref:
        description: ServiceRef selects the service when Origin is OriginPlatform.
        type: string
      window:
        description: |-
          Window is how much of a platform timeseries is fetched, backwards from
          the moment the environment starts: a duration like "36h", "7d", "4w" or
          "1y". The fetched window is then replayed like an uploaded dataset and
          only changes on the next reload.
        type: string
    type: object
  domain.DatedChange:
    properties:
      at:
        description: |-
          At must be a whole second. Every clock decision of the runtime is made on
          the second grid and the store truncates to milliseconds, so a fraction
          here would mean one instant in the document and another after a round trip.
          It is compared through At.Unix(), which is free of the zone it was written
          in.
        type: string
      target:
        description: Target names what changes, in one of the forms ParseTimelineTarget
          reads.
        type: string
      value:
        description: |-
          Value is numeric in v1: every field a target can name is a number, so an
          interface{} here would be a format nothing reads.
        type: number
    type: object
  domain.Direction:
    enum:
    - sensor
    - actuator
    type: string
    x-enum-varnames:
    - Sensor
    - Actuator
  domain.Environment:
    properties:
      context:
        additionalProperties: true
        description: |-
          Context is the shared surroundings every zone below can read: outdoor
          temperature, irradiation, calendar. Initial values only - unless the
          timeline governs the key, see Timeline.
        type: object
      context_sources:
        additionalProperties:
          $ref: '#/definitions/domain.Source'
        description: |-
          ContextSources drive context keys over time: outdoor temperature follows
          a day cycle, irradiance follows the sun. Without a source a context key
          keeps its initial value until somebody sets it by hand, which makes the
          context look inert. Keyed by the context key the source writes.
        type: object
      external_graph_ref:
        description: |-
          ExternalGraphRef is the id of the graph this environment is mirrored as in
          the device-repository, so other applications can consume a simulated site
          like a real one.

          The server decides and enforces this value; a client-sent value is
          ignored, since the whole document is sent on every update and an echoed or
          invented ref would let one environment overwrite another's graph. See
          reconcileGraphRef in lib/api.
        type: string
      id:
        type: string
      name:
        type: string
      owner:
        description: |-
          Owner is the creator's user id, decided by the server from the token and
          kept on update, so a value sent in a request body is ignored.
        type: string
      seed:
        description: |-
          Every stochastic source derives from Seed, so the same environment and
          clock produce the same values.
        type: integer
      timeline:
        description: |-
          Timeline carries the dated changes of this environment: a source parameter
          or a context value that takes effect at an instant, so a measure with a
          start date is one document with a step in it rather than two documents.
          Empty is the ordinary case and the behaviour of every document stored
          before this field existed. See docs/dated-changes.md.
        items:
          $ref: '#/definitions/domain.DatedChange'
        type: array
      type:
        $ref: '#/definitions/domain.EnvironmentType'
      version:
        description: |-
          Version is counted by the server: every successful write increments it,
          and a write is refused unless the client's version still matches the
          stored one - this is what keeps two editors from overwriting each other's
          devices. Zero means the client does not take part; a document written
          before this field existed reads as zero too.
        type: integer
      zones:
        items:
          $ref: '#/definitions/domain.Zone'
        type: array
    type: object
  domain.EnvironmentType:
    enum:
    - industrial_site
    - office_building
    - apartment_building
    - single_family_home
    - apartment
    type: string
    x-enum-varnames:
    - IndustrialSite
    - OfficeBuilding
    - ApartmentBuilding
    - SingleFamilyHome
    - Apartment
  domain.Fault:
    properties:
      duration_seconds:
        type: integer
      factor:
        description: |-
          Factor is what a spike multiplies the reading by. Zero is a real, named
          defect - the reading a broken sensor sends - so it is a usable value here
          and only 1 is refused, since it would be invisible in the series.
        type: number
      from:
        description: |-
          From and To are the window. To is exclusive, so two windows meeting at one
          instant do not both cover it. A meter exchange carries From alone: the new
          register keeps counting, so there is nothing for To to end.
        type: string
      kind:
        $ref: '#/definitions/domain.FaultKind'
      per_hour:
        description: |-
          PerHour and DurationSeconds are the rate. The draw is on the channel's
          evaluation step and derives from the environment seed, so the same document
          and clock produce the same occurrences on every path.
        type: number
      reset_to:
        description: ResetTo is the reading the new register starts at after an exchange.
        type: number
      to:
        type: string
    type: object
  domain.FaultKind:
    enum:
    - outage
    - frozen
    - spike
    - meter_exchange
    type: string
    x-enum-varnames:
    - FaultOutage
    - FaultFrozen
    - FaultSpike
    - FaultMeterExchange
  domain.FormulaSource:
    properties:
      expression:
        type: string
      inputs:
        additionalProperties:
          type: string
        description: Inputs maps a name usable in Expression to a channel id or context
          key.
        type: object
    type: object
  domain.Problem:
    properties:
      message:
        type: string
      path:
        type: string
    type: object
  domain.ProfileSource:
    properties:
      base:
        type: number
      cumulative:
        description: Cumulative turns the profile into a meter reading that keeps
          counting up.
        type: boolean
      hour_factors:
        description: HourFactors has 24 entries, WeekdayFactors 7 starting at monday.
        items:
          type: number
        type: array
      spread_percent:
        description: SpreadPercent is the random variation around the resulting value.
        type: number
      weekday_factors:
        items:
          type: number
        type: array
    type: object
  domain.ResampleMode:
    enum:
    - hold
    - linear
    - distribute
    type: string
    x-enum-varnames:
    - ResampleHold
    - ResampleLinear
    - ResampleDistribute
  domain.ScheduleGate:
    properties:
      context_key:
        type: string
      threshold:
        type: number
    type: object
  domain.ScheduleSource:
    properties:
      gate:
        allOf:
        - $ref: '#/definitions/domain.ScheduleGate'
        description: |-
          Gate, when set, is the switch that starts the programme. Nil means the
          cycle runs for as long as the environment does.
      run_once:
        description: |-
          RunOnce holds the last state instead of starting the cycle over. It is the
          shape of a job rather than of a running plant: a forklift charging once per
          shift stops charging and stays stopped. With a Gate every opening starts a
          new single run.
        type: boolean
      state_key:
        description: |-
          StateKey is the asset state key the name of the current state is written
          to. It is mandatory and explicit rather than derived from the channel id:
          whoever reads it - a formula input, a dashboard tile - has to spell it out,
          and a key nobody chose is a key nobody finds.
        type: string
      states:
        description: |-
          States are run in the order they are written, and the last one is followed
          by the first again unless RunOnce says otherwise.
        items:
          $ref: '#/definitions/domain.ScheduleState'
        type: array
    type: object
  domain.ScheduleState:
    properties:
      duration_seconds:
        description: |-
          DurationSeconds is how long the step is held. DurationSpreadPercent varies
          it per cycle, drawn from the environment seed, so a plant does not take
          the same exact time to set up every cycle; it stays below 100 percent,
          since a step of no length is not a step.
        type: integer
      duration_spread_percent:
        type: number
      name:
        description: |-
          Name is what is written into the asset state while this step runs. It is
          the reason the source exists, so it is not optional.
        type: string
      spread_percent:
        type: number
      state_writes:
        additionalProperties:
          type: number
        description: |-
          StateWrites are further asset state values this step declares - the air
          demand of a machine that is running, the setpoint it asks of the hall -
          read by formulas and by whoever reads the live state.

          The keys of every state of the schedule are written on every evaluation,
          not only the current state's: a key another state declares is written as 0
          here, so an air demand set while running does not still stand once the
          machine is idle.
        type: object
      value:
        description: |-
          Value is what the channel publishes while the step runs, and
          SpreadPercent varies it the way a profile's spread does - per time slot,
          not per cycle, so that a channel publishing on change has something to see
          inside a step that would otherwise be a perfectly flat line.
        type: number
    type: object
  domain.ScriptSource:
    properties:
      code:
        type: string
    type: object
  domain.Source:
    properties:
      dataset:
        $ref: '#/definitions/domain.DatasetSource'
      formula:
        $ref: '#/definitions/domain.FormulaSource'
      interval_seconds:
        description: |-
          IntervalSeconds is how often the source computes, which is not the same as
          how often the channel publishes. Zero means it computes when the channel
          publishes. A legacy world evolved its state on one interval and read it out
          on another, and folding the two together would change the simulation.
        type: integer
      kind:
        $ref: '#/definitions/domain.SourceKind'
      profile:
        $ref: '#/definitions/domain.ProfileSource'
      schedule:
        $ref: '#/definitions/domain.ScheduleSource'
      script:
        $ref: '#/definitions/domain.ScriptSource'
    type: object
  domain.SourceKind:
    enum:
    - script
    - profile
    - dataset
    - formula
    - aggregate
    - schedule
    type: string
    x-enum-varnames:
    - SourceScript
    - SourceProfile
    - SourceDataset
    - SourceFormula
    - SourceAggregate
    - SourceSchedule
  domain.ValidationError:
    properties:
      problems:
        items:
          $ref: '#/definitions/domain.Problem'
        type: array
    type: object
  domain.Zone:
    properties:
      assets:
        items:
          $ref: '#/definitions/domain.Asset'
        type: array
      id:
        type: string
      initial_states:
        additionalProperties: true
        description: InitialStates seeds the runtime state at start. Live values are
          not here.
        type: object
      name:
        type: string
      tags:
        description: |-
          Tags carry what the fixed type list deliberately does not, so that a new
          kind of space does not require a new enum value.
        items:
          type: string
        type: array
      time_constants:
        additionalProperties:
          type: integer
        description: |-
          TimeConstants makes a state value follow a set point instead of jumping to
          it, in seconds per state key - the thermal inertia of a space. A key with
          no time constant is set at once, which is what every stored document does.
        type: object
      type:
        $ref: '#/definitions/domain.ZoneType'
      zones:
        items:
          $ref: '#/definitions/domain.Zone'
        type: array
    type: object
  domain.ZoneType:
    enum:
    - site
    - building
    - floor
    - unit
    - hall
    - room
    type: string
    x-enum-varnames:
    - ZoneSite
    - ZoneBuilding
    - ZoneFloor
    - ZoneUnit
    - ZoneHall
    - ZoneRoom
  repo.DatasetColumn:
    properties:
      from_unix:
        type: integer
      name:
        type: string
      points:
        type: integer
      to_unix:
        type: integer
    type: object
  repo.DatasetMeta:
    properties:
      columns:
        items:
          $ref: '#/definitions/repo.DatasetColumn'
        type: array
      created_unix:
        type: integer
      id:
        type: string
      name:
        type: string
      owner:
        description: Owner is the uploader's user id, decided by the server; read-only
          for callers.
        type: string
      size_bytes:
        type: integer
      timezone:
        type: string
    type: object
  repo.StateChange:
    properties:
      assets:
        additionalProperties:
          additionalProperties: true
          type: object
        type: object
      context:
        additionalProperties: true
        type: object
      zones:
        additionalProperties:
          additionalProperties: true
          type: object
        type: object
    type: object
  runtime.BackfillChannelStatus:
    properties:
      asset_id:
        type: string
      backfillable:
        description: Backfillable is false when SkipReason says why not.
        type: boolean
      channel_id:
        type: string
      failed:
        type: integer
      last_error:
        description: |-
          LastError is the most recent publish failure of this channel, kept so a
          job that mostly worked still says what went wrong.
        type: string
      name:
        type: string
      published:
        description: |-
          Published counts the readings that reached the platform, Silent the steps
          that sent nothing - a tick that produced no value at all (a dataset
          outside its own time range), or one whose value did not move far enough
          for a channel publishing on change - and Failed the ones the platform
          refused. The three add up to the steps of the channel's grid.
        type: integer
      silent:
        type: integer
      skip_reason:
        type: string
    type: object
  runtime.BackfillState:
    enum:
    - running
    - done
    - failed
    - cancelled
    type: string
    x-enum-varnames:
    - BackfillRunning
    - BackfillDone
    - BackfillFailed
    - BackfillCancelled
  runtime.BackfillStatus:
    properties:
      channels:
        items:
          $ref: '#/definitions/runtime.BackfillChannelStatus'
        type: array
      channels_done:
        type: integer
      channels_total:
        description: |-
          ChannelsTotal counts every channel of the environment, backfillable or
          not; ChannelsDone counts the ones that are finished with.
        type: integer
      current_channel:
        description: CurrentChannel and Position are where the job stands right now.
        type: string
      environment_id:
        type: string
      error:
        type: string
      finished_at:
        type: string
      from:
        type: string
      position:
        type: string
      published:
        type: integer
      started_at:
        type: string
      state:
        $ref: '#/definitions/runtime.BackfillState'
      to:
        type: string
    type: object
  runtime.HistoryChannelStatus:
    properties:
      asset_id:
        type: string
      channel_id:
        type: string
      failed:
        type: integer
      last_error:
        type: string
      name:
        type: string
      publishable:
        type: boolean
      published:
        type: integer
      reason:
        type: string
      silent:
        type: integer
    type: object
  runtime.HistoryState:
    enum:
    - running
    - done
    - failed
    - cancelled
    type: string
    x-enum-varnames:
    - HistoryRunning
    - HistoryDone
    - HistoryFailed
    - HistoryCancelled
  runtime.HistoryStatus:
    properties:
      channels:
        description: |-
          Channels is what became of every channel the run drove. It is filled when
          the run ends and stays empty for one that broke, since a run that panicked
          returns nothing. It is what tells "the environment publishes nothing" from
          "every channel of it was unpublishable", which look identical in the
          totals.
        items:
          $ref: '#/definitions/runtime.HistoryChannelStatus'
        type: array
      environment_id:
        type: string
      error:
        type: string
      failed:
        type: integer
      finished_at:
        type: string
      from:
        type: string
      last_error:
        description: |-
          LastError is the most recent publish failure of the run, kept so a run that
          mostly worked still says what went wrong. Error is what broke the run
          itself.
        type: string
      position:
        description: Position is the virtual instant the run has reached.
        type: string
      published:
        description: |-
          Published and Failed count the steps of the publish grids of every channel:
          the ones that sent at least one reading, and the ones the platform refused.
        type: integer
      started_at:
        type: string
      state:
        $ref: '#/definitions/runtime.HistoryState'
      to:
        description: |-
          To is where the run ended, which is the present at the moment it stopped
          simulating: it moves forward past the instant of the request while the run
          chases the time it spent simulating.
        type: string
    type: object
info:
  contact: {}
  description: |-
    Simulates environments — sites, buildings and apartments — and
    their devices, and publishes their data as if it came from real
    hardware. An environment is one document: GET returns what PUT
    accepts, so a whole site can be created in a single call.

    The legacy world/room/device endpoints are being replaced by the
    environment api and are not documented here.
  title: MOSES API
  version: 1.0.0
paths:
  /datasets:
    get:
      description: Every dataset owned by the caller, ordered by name. Empty list,
        never null.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/repo.DatasetMeta'
            type: array
        "401":
          description: the token carries no subject
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
      security:
      - Bearer: []
      summary: List datasets
      tags:
      - Dataset
    post:
      consumes:
      - text/plain
      description: 'The body is the file itself (CSV: header line, time column first,
        one or more named value columns). Dialect is detected: comma or semicolon
        separated, decimal point or comma, timestamps as RFC3339, "2006-01-02 15:04",
        "02.01.2006 15:04" or unix seconds. Offsetless timestamps are interpreted
        in the tz parameter''s zone. The file is parsed before it is stored, so a
        broken file is refused here with a line number instead of playing silence
        later.'
      parameters:
      - description: display name of the dataset
        in: query
        name: name
        required: true
        type: string
      - description: IANA timezone for offsetless timestamps (default Europe/Berlin)
        in: query
        name: tz
        type: string
      - description: the file content
        in: body
        name: file
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/repo.DatasetMeta'
        "400":
          description: the file, the name or the timezone is unusable; parse errors
            carry the line
          schema:
            type: string
        "401":
          description: the token carries no subject
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
      security:
      - Bearer: []
      summary: Upload a timeseries dataset
      tags:
      - Dataset
  /datasets/{id}:
    delete:
      description: A channel still referencing the deleted dataset stops playing on
        its next reload and is reported there.
      parameters:
      - description: dataset id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: deleted, or there was nothing to delete
          schema:
            type: string
        "401":
          description: the token carries no subject
          schema:
            type: string
        "404":
          description: the dataset belongs to somebody else
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
      security:
      - Bearer: []
      summary: Delete one dataset
      tags:
      - Dataset
    get:
      parameters:
      - description: dataset id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/repo.DatasetMeta'
        "401":
          description: the token carries no subject
          schema:
            type: string
        "404":
          description: no such dataset, or no access to it
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
      security:
      - Bearer: []
      summary: Get one dataset's metadata
      tags:
      - Dataset
  /device-types:
    get:
      description: 'Every device type that publishes through this service''s protocol,
        with its services: the id, name, direction and characteristic of each, which
        is everything the channels of an asset need. Offering this list is what lets
        an editor ask for a device type instead of an id.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/devices.DeviceType'
            type: array
        "401":
          description: the token carries no subject
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
      security:
      - Bearer: []
      summary: List the device types an asset can be built from
      tags:
      - Catalog
  /devices:
    post:
      consumes:
      - application/json
      description: Registers a device of the given type and returns its id, which
        becomes the asset's external_ref. It is created with the caller's own token,
        so it belongs to whoever built the asset.
      parameters:
      - description: device type and name
        in: body
        name: device
        required: true
        schema:
          $ref: '#/definitions/api.CreateDeviceRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/devices.Device'
        "400":
          description: the body is unreadable or incomplete
          schema:
            type: string
        "401":
          description: the token carries no subject
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
      security:
      - Bearer: []
      summary: Create the platform device of a simulated asset
      tags:
      - Catalog
  /devices/{id}:
    delete:
      description: Removing an asset should not leave its device behind. Deleting
        one that does not exist is not an error.
      parameters:
      - description: device id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: deleted
          schema:
            type: string
        "401":
          description: the token carries no subject
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
      security:
      - Bearer: []
      summary: Delete the platform device of a simulated asset
      tags:
      - Catalog
  /doc:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: the specification
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
      summary: The generated openapi specification of this service
      tags:
      - Doc
  /environments:
    get:
      description: Every environment owned by the caller, ordered by name. Empty list,
        never null.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Environment'
            type: array
        "400":
          description: the token is missing or unreadable
          schema:
            type: string
        "401":
          description: the token carries no subject
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
      security:
      - Bearer: []
      summary: List environments
      tags:
      - Environment
    post:
      consumes:
      - application/json
      description: 'Any id in the body is ignored. Nested entities may omit their
        ids and get one assigned. An asset without an external_ref gets a platform
        device created for it, which is then deleted again when the asset or the environment
        is gone; a device attached to an asset by the caller is never deleted. external_managed
        is decided by the server and is always false on create. owner is the caller''s
        user id, decided by the server and ignored in the body. A created environment
        is shared with nobody; its devices are shared through /environments/{id}/shares
        afterwards. The environment is also mirrored as a graph in the device-repository;
        external_graph_ref names that graph and is assigned by the server, so sending
        it has no effect. A version in the body is ignored as well: a document that
        is being created has nothing to be concurrent with, and the one in the response
        is the one to send back on the next PUT. An asset''s submetered_by hangs it,
        in that mirrored graph, under the device of the named asset instead of its
        zone, as long as that asset is in the same top level zone; a reference to
        a missing asset, one outside that zone, or one that closes a cycle is refused
        with 400.'
      parameters:
      - description: the environment
        in: body
        name: environment
        required: true
        schema:
          $ref: '#/definitions/domain.Environment'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Environment'
        "400":
          description: every problem, with the path of the offending field
          schema:
            $ref: '#/definitions/domain.ValidationError'
        "401":
          description: the token carries no subject
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
      security:
      - Bearer: []
      summary: Create an environment with a server assigned id
      tags:
      - Environment
  /environments/{id}:
    delete:
      description: The platform devices moses created for the assets of this environment
        are deleted with it. Devices attached to an asset by the caller stay, together
        with their timeseries. The graph this environment is mirrored as is deleted
        with it, and so is the record of who its devices were shared with. Neither
        a device nor a graph that cannot be deleted fails the request.
      parameters:
      - description: environment id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: deleted, or there was nothing to delete
          schema:
            type: string
        "401":
          description: the token carries no subject
          schema:
            type: string
        "404":
          description: the environment belongs to somebody else
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
      security:
      - Bearer: []
      summary: Delete one environment and its runtime state
      tags:
      - Environment
    get:
      description: Returns exactly what PUT accepts, so an export can be edited and
        put back.
      parameters:
      - description: environment id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Environment'
        "401":
          description: the token carries no subject
          schema:
            type: string
        "404":
          description: no such environment, or no access to it
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
      security:
      - Bearer: []
      summary: Export one environment
      tags:
      - Environment
    put:
      consumes:
      - application/json
      description: |-
        Idempotent. The id in the path wins over the one in the body, so a document can be copied to a new id without editing it. Ownership comes from the token on create and never transfers on update; owner is served read-only and a value in the body is ignored. An asset without an external_ref gets a platform device created for it, and a device created that way is deleted again when the asset that carried it is gone from the document; a device attached to an asset by the caller is never deleted. external_managed says which is which and is decided by the server, so sending it has no effect. Who the devices of this environment are shared with is not part of the document: it is kept beside it and changed through /environments/{id}/shares, so an export carries no shares and an import hands nothing to the accounts of the environment it came from. A put to an id nothing is stored under starts unshared, even where an earlier environment under that id was shared. The environment is also mirrored as a graph in the device-repository, rebuilt from the document on every save, so a change made to that graph by hand does not survive; external_graph_ref names the graph and is decided by the server, so sending it has no effect either. An asset's submetered_by hangs it, in that mirrored graph, under the device of the named asset instead of its zone, as long as that asset is in the same top level zone; a reference to a missing asset, one outside that zone, or one that closes a cycle is refused with 400.

        Send back the `version` of the document you read and the write is refused with 409 if anybody stored a change in between; the response of every successful write carries the new version. Sending 0, or leaving the field out, writes unchecked — which is what a client that knows nothing of the field does, and what makes losing a concurrent edit, and the devices only the other document still references, possible.
      parameters:
      - description: environment id
        in: path
        name: id
        required: true
        type: string
      - description: the environment
        in: body
        name: environment
        required: true
        schema:
          $ref: '#/definitions/domain.Environment'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Environment'
        "400":
          description: every problem, with the path of the offending field
          schema:
            $ref: '#/definitions/domain.ValidationError'
        "401":
          description: the token carries no subject
          schema:
            type: string
        "404":
          description: the environment belongs to somebody else
          schema:
            type: string
        "409":
          description: the document was changed since it was read; the message names
            both versions
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
      security:
      - Bearer: []
      summary: Create or replace one environment
      tags:
      - Environment
  /environments/{id}/backfill:
    get:
      description: |-
        Where the job stands: running, done, failed or cancelled, how many channels are finished with, which instant it is at, and per channel either the number of readings published or the reason it was skipped.

        The registry is held in memory only. A restart forgets every job, and this then answers 404 rather than claiming a state it cannot know: a job is not resumable, because it would have to know which readings already reached the platform, and the platform keeps a second one rather than replacing it.
      parameters:
      - description: environment id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/runtime.BackfillStatus'
        "401":
          description: the token carries no subject
          schema:
            type: string
        "404":
          description: no such environment, no access to it, or nothing is known about
            a backfill of it
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
      security:
      - Bearer: []
      summary: The backfill of one environment
      tags:
      - Environment
    post:
      consumes:
      - application/json
      description: |-
        Computes the environment over the given window and publishes every reading with the timestamp it would have had, so that a model can be trained on history the environment never actually lived through. Runs asynchronously; the response is the job as it stands at that moment, and GET on the same path follows it.

        Only a channel whose platform service declares the attribute `senergy/time_path` can be backfilled, because that attribute is what makes the platform read the event time out of the payload instead of stamping the arrival time. moses does not change device types to add it. Only profile and dataset sources are reconstructed: a script source depends on the state its earlier runs left behind, and a formula follows from other channels. Every channel that is skipped says why in the status.

        The window may not end in the future, may not span more than 366 days, and may not come to more than two million readings in total across the channels of the environment; a reading is published synchronously, so that count is the runtime of the job.
      parameters:
      - description: environment id
        in: path
        name: id
        required: true
        type: string
      - description: the window to reconstruct
        in: body
        name: window
        required: true
        schema:
          $ref: '#/definitions/api.BackfillRequest'
      produces:
      - application/json
      responses:
        "202":
          description: accepted, with the job as it stands
          schema:
            $ref: '#/definitions/runtime.BackfillStatus'
        "400":
          description: the body is unreadable, or the window is empty, in the future,
            too long or too dense
          schema:
            type: string
        "401":
          description: the token carries no subject
          schema:
            type: string
        "404":
          description: no such environment, no access to it, or it is not running
            here
          schema:
            type: string
        "409":
          description: a backfill or a history run of this environment is already
            running
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
      security:
      - Bearer: []
      summary: Reconstruct one environment over a past window
      tags:
      - Environment
  /environments/{id}/history:
    delete:
      description: |-
        Ends a running simulation of the past. It does not wait and it does not undo: the run stops at its next step and hands the environment back to the live simulation, which then continues from the partial state — a consistent state of an earlier instant. The response is the run as it stood when the abort was accepted.

        A run over a year of minute data suspends the live simulation for a long time, which is why it has a switch a backfill does not need.
      parameters:
      - description: environment id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: the abort was accepted
          schema:
            $ref: '#/definitions/runtime.HistoryStatus'
        "401":
          description: the token carries no subject
          schema:
            type: string
        "404":
          description: no such environment, no access to it, or nothing is known about
            a history run of it
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
      security:
      - Bearer: []
      summary: Abort the history run of one environment
      tags:
      - Environment
    get:
      description: |-
        Where the run stands: running, done, failed or cancelled, which virtual instant it has reached, how many publish steps went out or were refused, and per channel what became of it — including the reason a channel published nothing at all. `done` means the live simulation is running again on the state the run arrived at; `failed` and `cancelled` mean it is running again on the partial state the run had reached, which is a consistent state of an earlier instant and not a rollback.

        The registry is held in memory only. A restart forgets every run, and this then answers 404 rather than claiming a state it cannot know.
      parameters:
      - description: environment id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/runtime.HistoryStatus'
        "401":
          description: the token carries no subject
          schema:
            type: string
        "404":
          description: no such environment, no access to it, or nothing is known about
            a history run of it
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
      security:
      - Bearer: []
      summary: The history run of one environment
      tags:
      - Environment
    post:
      consumes:
      - application/json
      description: |-
        Simulates the environment from `from` to the present on a virtual clock and publishes every reading under the instant it was computed for. Unlike a backfill the run carries state, and the state it arrives at **becomes** the live state: a meter reading continues into the live one as one ramp rather than starting a second one next to it. Runs asynchronously; the response is the run as it stands, `GET` follows it and `DELETE` aborts it.

        **The live simulation of this environment is suspended for the duration of the run and its current state is discarded.** While it runs, `PATCH /environments/{id}/state`, the state snapshot and a second run are answered with 409, incoming commands are dropped, and an edit to the definition takes effect when the run ends. State `done` means the live simulation is running again on the state the run arrived at.

        Only a channel whose platform service declares the attribute `senergy/time_path` can publish with a historical timestamp; every other channel is computed but sends nothing, so the environment as a whole still arrives at the right state. Every source kind is simulated, script and schedule included, which is what a backfill cannot do. Every channel that publishes nothing says why in `channels` of the status.

        There is no end: the run ends at the present, and once it has simulated the window it keeps going until it has caught up with the time it spent doing so, so that no gap is left at the handover. `to` in the status is therefore where the run actually ended.

        The window may not start in the future, has to be at least a minute and at most 366 days long, and may not come to more than twenty million simulation steps across the channels and context sources of the environment.
      parameters:
      - description: environment id
        in: path
        name: id
        required: true
        type: string
      - description: the instant to start from
        in: body
        name: window
        required: true
        schema:
          $ref: '#/definitions/api.HistoryRequest'
      produces:
      - application/json
      responses:
        "202":
          description: accepted, with the run as it stands
          schema:
            $ref: '#/definitions/runtime.HistoryStatus'
        "400":
          description: the body is unreadable, or the window is in the future, too
            long or too dense
          schema:
            type: string
        "401":
          description: the token carries no subject
          schema:
            type: string
        "404":
          description: no such environment, no access to it, or it is not running
            here
          schema:
            type: string
        "409":
          description: a history run or a backfill of this environment is already
            running
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
      security:
      - Bearer: []
      summary: Run one environment from a past instant up to now
      tags:
      - Environment
  /environments/{id}/shares:
    get:
      description: |-
        The stored set, plus the number of managed devices it acts on and whether the graph of this environment is shared along with them. Only devices moses created for the assets of this environment count; a device attached by the caller is never shared, because moses does not own it.

        After a failed share the set stands at the union of what was stored and what was asked for, which is what the next call needs to withdraw the devices that did go through.
      parameters:
      - description: environment id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SharesResponse'
        "401":
          description: the token carries no subject
          schema:
            type: string
        "404":
          description: no such environment, or no access to it
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
      security:
      - Bearer: []
      summary: The accounts the devices of one environment are shared with
      tags:
      - Environment
    put:
      consumes:
      - application/json
      description: |-
        Replaces the set: everyone named gets `read` and `execute` on every device moses created for this environment and on the graph it is mirrored as, everyone who was in the stored set and is not named any more loses their entry. The rights are fixed and the environment document itself is not shared — it stays with its owner and the platform administrators.

        A device attached to an asset by the caller is never touched, since moses does not own it. An environment whose graph was never mirrored has none to share and is not treated as an error. An entry carrying `administrate` is never changed or removed, which is what keeps the owner and the administrators out of the set. `write` an entry already had stays as it is while it is shared, and goes with the entry when the share is withdrawn.

        Applied resource by resource with the caller's own token, so the platform's own rule decides who may be named: a caller without the `admin` role may share with groups they are a member of and with users who share a group with them. Such a refusal comes back per resource, and when every failure of a call is one of them the answer is a `400` with that list; a `502` means at least one failure was not the caller's fault.

        Before anything is written, the union of the stored and the requested set is recorded; the requested set replaces it once every resource went through. If a resource fails, the union stands — so the next call, with any set, withdraws what the failed one managed to grant. The whole application is bounded at eight seconds: a very large environment can run out of it, reports the resources it did not reach as failures and needs a second call.

        Assets added to the environment later inherit the stored set when their device is created, so a share does not have to be renewed after an edit.
      parameters:
      - description: environment id
        in: path
        name: id
        required: true
        type: string
      - description: the accounts to share with; users are keycloak user ids, groups
          are group paths with a leading slash
        in: body
        name: shares
        required: true
        schema:
          $ref: '#/definitions/api.ShareTargets'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SharesResponse'
        "400":
          description: either the request itself is refused - unreadable or too large
            body, an empty user id, a group that is not a path, an entry beyond 256
            characters, or a set that would carry more than 100 accounts - and then
            the answer is a plain message, or every resource refused the caller and
            then it is the list
          schema:
            $ref: '#/definitions/api.ShareFailures'
        "401":
          description: the token carries no subject
          schema:
            type: string
        "404":
          description: no such environment, or no access to it
          schema:
            type: string
        "409":
          description: another share of this environment was stored in between; read
            the set again and repeat
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
        "502":
          description: the resources the rights could not be written on, and why;
            `kind` says whether it was a device or the graph, `status` what permissions-v2
            answered
          schema:
            $ref: '#/definitions/api.ShareFailures'
      security:
      - Bearer: []
      summary: Share the devices of one environment with users and groups
      tags:
      - Environment
  /environments/{id}/state:
    get:
      description: |-
        What the running simulation currently holds: the shared context, the state of every zone and the state of every asset. This is the reading direction of PATCH on the same path and answers in the same shape, so a value can be read, changed and sent straight back.

        A zone value that the definition gives a time constant is on its way to its set point rather than at it; it is resolved to the instant in `as_of`, which is the same value a script would read at that moment.

        These are live values, not the definition: they are not what GET /environments/{id} returns, and they are not stored by reading them.

        An environment that is stored but not simulated here answers 200 with `running: false` and no states. That is not an error: another instance may run it, or it may just have been written. Only an environment that does not exist, or one the caller may not see, is a 404.

        While a history run rebuilds the environment from a past instant the answer is 200 with `running: false` and `history_running: true`. There is no live state to read then: the environment stands in the past, and reading it would resolve its values against the wall clock and corrupt the run.
      parameters:
      - description: environment id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.EnvironmentState'
        "401":
          description: the token carries no subject
          schema:
            type: string
        "404":
          description: no such environment, or no access to it
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
      security:
      - Bearer: []
      summary: Live state of one environment
      tags:
      - Environment
    patch:
      consumes:
      - application/json
      description: |-
        Merges the given values into the live state. Only the keys named are touched; everything else keeps running. Context is the shared surroundings every zone reads, zones and assets are keyed by their id from the definition. Takes effect on the next tick of the scripts that read it, and is not a change to the definition.

        A context key the environment's `timeline` governs is a declared function of time and cannot be moved from here: a value differing from the declared one is refused with 400. Sending the value GET on this path handed out is not a move and is accepted, so reading the state, editing one key and sending the whole thing back works unchanged.
      parameters:
      - description: environment id
        in: path
        name: id
        required: true
        type: string
      - description: the values to set
        in: body
        name: state
        required: true
        schema:
          $ref: '#/definitions/repo.StateChange'
      produces:
      - application/json
      responses:
        "204":
          description: applied
          schema:
            type: string
        "400":
          description: the body is unreadable, empty, names a zone or asset the definition
            does not have, or moves a context key the timeline governs; a change wrong
            in both ways names both
          schema:
            type: string
        "401":
          description: the token carries no subject
          schema:
            type: string
        "404":
          description: no such environment, no access to it, or it is not running
            here
          schema:
            type: string
        "409":
          description: a history run of this environment is in progress, so it stands
            at a past instant
          schema:
            type: string
        "500":
          description: error message
          schema:
            type: string
      security:
      - Bearer: []
      summary: Set live state of one running environment
      tags:
      - Environment
securityDefinitions:
  Bearer:
    description: A keycloak issued JWT. Verified at the gateway, not here.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
